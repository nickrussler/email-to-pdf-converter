name: Check, Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      TZ: UTC
      CHROME_PATH: google-chrome

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Corretto JDK 8
      uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: '8'
    - name: Install archived wkhtmltopdf
      shell: bash
      run: |
        set -euo pipefail
        package="$RUNNER_TEMP/wkhtmltox.deb"
        curl --fail --location --retry 3 \
          https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb \
          --output "$package"
        echo "ee88d74834bdec650f7432c7d3ef1c981e42ae7a762a75a01f7f5da59abc18d5  $package" | sha256sum --check
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends fontconfig fonts-dejavu-core "$package"
        wkhtmltopdf --version
    - name: Verify Chrome
      run: google-chrome --version
    - name: Formatting Check
      run: ./gradlew --no-daemon spotlessCheck
    - name: Tests
      run: ./gradlew --no-daemon check
    - name: Chrome download e2e
      env:
        CHROME_DOWNLOAD_E2E: "1"
        CHROME_DOWNLOAD_CACHE: ${{ runner.temp }}/chrome-download-cache
      run: |
        rm -rf "$CHROME_DOWNLOAD_CACHE"
        ./gradlew --no-daemon cleanTest test --tests render.chrome.ChromeDownloadE2ETest
    - name: Build Jar
      run: ./gradlew --no-daemon shadowJar
    - name: Archive test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          build/reports/
          build/test-results/
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: build/libs/emailconverter-*-all.jar
