name: Page Screenshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Corretto JDK 8
      uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: '8'
    - name: Set desktop resolution
      shell: pwsh
      run: |
        Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
        Get-DisplayResolution
    - name: Capture GUI screenshot
      shell: pwsh
      env:
        GUI_SCREENSHOT: "1"
        GUI_SCREENSHOT_PATH: build/screenshots/main-window.png
      run: |
        .\gradlew.bat --no-daemon --max-workers=2 test --tests gui.MainWindowScreenshotTest
        if (!(Test-Path build/screenshots/main-window.png)) {
          throw 'GUI screenshot was not generated'
        }
    - name: Prepare Pages site
      shell: bash
      run: |
        mkdir -p _site
        cp build/screenshots/main-window.png _site/main-window.png
    - name: Configure Pages
      uses: actions/configure-pages@v5
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: Verify screenshot is from current main
      shell: bash
      run: |
        git fetch origin main --quiet
        current="$(git rev-parse HEAD)"
        main="$(git rev-parse origin/main)"
        if [ "$current" != "$main" ]; then
          echo "::error::Screenshot was built from $current, but main is $main. Refusing to deploy."
          exit 1
        fi
    - name: Deploy Pages
      id: deployment
      uses: actions/deploy-pages@v4
